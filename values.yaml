# ADT OpenBao wrapper chart — default values.
#
# Two concerns live here:
#   1. `bootstrap.*`      -- config for the auto-init/unseal Job this wrapper adds.
#   2. `openbao.*`        -- values passed straight through to the upstream
#                            OpenBao subchart (dependency name = "openbao").
#
# Environment overlays (adt-grc-gitops environments/openbao/<env>/values.yaml)
# override the route host and anything else per-cluster.

# --- Bootstrap Job (added by this wrapper) ---------------------------------
bootstrap:
  enabled: true
  # Public image shipping kubectl (+ curl/jq). The in-cluster registry
  # (image-registry.openshift-image-registry.svc:5000) is not reachable from the
  # node's image-pull path on this CRC cluster, so use a Docker Hub image (which
  # the cluster can pull, same as the runner's python image).
  image: docker.io/alpine/k8s:1.33.13
  # Name of the pinned Helm release / StatefulSet / pod-0 / service. Keep this
  # in sync with the Argo CD Application `releaseName`.
  releaseName: openbao
  # Secret (created by the Job) that holds the single unseal key + root token.
  keysSecretName: openbao-keys

# --- Plugin staging (added by this wrapper) --------------------------------
# OpenBao secrets/auth plugins are external binaries that must live on-disk in
# the server's `plugin_directory`. This wrapper provisions a dedicated PVC for
# them and a one-shot Job that fetches each binary from a GHES release asset,
# verifies its SHA-256, and drops it on the PVC (mode 0755). The server mounts
# the same PVC read-only at `plugin_directory` (set in the standalone config
# below). No plugin binary ever ships inside the image.
#
# Enabled by default: this wrapper exists to host the keyless-build Quay secrets
# engine. The server volume/volumeMount below reference `pvcName`, so if you
# ever set `enabled: false` you must also drop those two entries in an overlay.
plugins:
  enabled: true
  pvcName: openbao-plugins
  mountPath: /openbao/plugins
  # Image used by the one-shot fetch Job — ships curl + sha256sum. Same public
  # image the bootstrap Job uses (the node can pull Docker Hub).
  image: docker.io/alpine/k8s:1.33.13
  pvc:
    size: 1Gi
    storageClass: crc-csi-hostpath-provisioner
    accessMode: ReadWriteOnce
  # Secret (key: `token`) holding a GHES token that can read the release assets
  # below. Created out-of-band; only needed while the Job populates the PVC, so
  # it can be deleted once the plugins are staged.
  fetchTokenSecret: openbao-plugin-fetch-token
  # ConfigMap (key: `ca.crt`) with the CA that signs the GHES host, so the Job
  # verifies TLS to adt-git01 (no -k, token never crosses an unverified channel).
  # Created out-of-band by copying the ARC runner's GHES CA cert.
  caBundleConfigMap: openbao-plugin-ghes-ca
  # Each item is fetched to <mountPath>/<name>, SHA-256-verified, chmod 0755.
  #   name   -- plugin command (binary filename; the OpenBao catalog -command)
  #   url    -- GHES release-asset API URL (fetched with Accept: octet-stream)
  #   sha256 -- hex digest; the Job and the OpenBao catalog must agree on this
  items: []
    # - name: openbao-plugin-secrets-quay
    #   url: https://adt-git01.adt.network/api/v3/repos/<owner>/<repo>/releases/assets/<id>
    #   sha256: <hex>

# --- Upstream OpenBao subchart ---------------------------------------------
openbao:
  global:
    # Rely on OpenShift SCCs instead of the chart's hard-coded uid/fsGroup.
    openshift: true

  # OpenBao only for now — no Agent injector, no CSI provider.
  injector:
    enabled: false
  csi:
    enabled: false

  ui:
    enabled: true

  server:
    image:
      repository: openbao/openbao-ubi

    # No Kubernetes auth method yet, so skip the cluster-scoped
    # system:auth-delegator ClusterRoleBinding. Keeps the AppProject's
    # clusterResourceWhitelist to just Namespace, like the other services.
    authDelegator:
      enabled: false

    # Single-node CRC: standalone with file storage on a PVC.
    dataStorage:
      enabled: true
      size: 5Gi
      storageClass: crc-csi-hostpath-provisioner
      accessMode: ReadWriteOnce
      mountPath: /openbao/data

    standalone:
      enabled: true
      config: |
        ui = true
        plugin_directory = "/openbao/plugins"
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
        }
        storage "file" {
          path = "/openbao/data"
        }

    # Plain HTTP in-cluster; TLS is terminated at the OpenShift router (edge).
    route:
      enabled: true
      host: ""            # set per-environment
      tls:
        termination: edge

    # Self-unseal on restart. The openbao-keys Secret is mounted optionally so
    # the pod still starts on first boot (before the bootstrap Job creates it);
    # the hook no-ops when the key file is absent or the vault is already
    # unsealed. First-time init + secret creation is done by the bootstrap Job.
    volumes:
      - name: openbao-keys
        secret:
          secretName: openbao-keys
          optional: true
      # Plugin binaries, staged onto a PVC by the plugins fetch Job (see
      # templates/plugins.yaml). Mounted read-only; path matches
      # `plugin_directory` in the standalone config above.
      - name: openbao-plugins
        persistentVolumeClaim:
          claimName: openbao-plugins
    volumeMounts:
      - name: openbao-keys
        mountPath: /openbao/keys
        readOnly: true
      - name: openbao-plugins
        mountPath: /openbao/plugins
        readOnly: true
    postStart:
      - /bin/sh
      - -c
      - |
        export BAO_ADDR=http://127.0.0.1:8200
        key_file=/openbao/keys/unseal-key
        [ -f "$key_file" ] || exit 0
        i=0
        while [ "$i" -lt 30 ]; do
          if bao status -format=json >/dev/null 2>&1; then break; fi
          i=$((i + 1)); sleep 2
        done
        if bao status -format=json 2>/dev/null | grep -q '"sealed"[: ]*true'; then
          bao operator unseal "$(cat "$key_file")" || true
        fi
        exit 0
